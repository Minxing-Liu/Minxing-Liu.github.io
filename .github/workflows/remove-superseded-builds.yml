name: Remove superseded build records
on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-superseded-builds.yml]
permissions: {}
jobs:
  cleanup:
    if: github.repository == 'Minxing-Liu/Minxing-Liu.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runIds = [38262690997,38262687486,38262683311,38262680727,38262677685,38262672743,38260290723,38260255215,38223082983,38223075409,38223029366,38064627151,38019327311];
            const { owner, repo } = context.repo;
            for (const run_id of runIds) {
              if (run_id === context.runId) throw new Error('Refusing to delete current run');
              let run;
              try {
                ({ data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id }));
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              if (run.status !== 'completed' || run.head_branch !== 'main' ||
                  run.name !== 'Build and publish Butterfly' ||
                  !['2026-10-10','2026-10-12'].includes(run.created_at.slice(0,10))) {
                throw new Error('Unexpected run metadata for ' + run_id);
              }
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id });
              core.info('Deleted superseded run ' + run_id);
            }
            core.notice('Targeted build record cleanup completed');
